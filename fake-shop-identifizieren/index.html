<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Fake-Shop identifizieren</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8efe9;color:#202934;font:17px/1.5 system-ui}main{max-width:900px;margin:auto;padding:24px}section,header{background:white;padding:24px;border:1px solid #aab5af;border-radius:12px;margin-bottom:16px}button,a.button{font:inherit;cursor:pointer;border:1px solid #34465d;border-radius:7px;background:white;color:#213348;padding:8px 13px;text-decoration:none}button.primary{background:#26374e;color:white}nav,.choices,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar{position:sticky;top:0;background:#e8efe9;padding:10px 0;z-index:2;align-items:center}.product{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px}.phone{width:115px;height:218px;margin:auto;border:6px solid #202731;border-radius:22px;background:linear-gradient(145deg,#111927,#46566d,#151b25)}.price{font-size:1.8em;font-weight:bold}.hit{display:block;padding:8px;border-radius:5px}.marking .hit{cursor:crosshair}.marked{outline:3px solid #285d82;background:#e5f1ff}#timer{font-size:1.3em;font-weight:bold}.address{overflow-wrap:anywhere;background:#f1f3f5}small{display:block}h1,h2{line-height:1.15}@media(max-width:550px){main{padding:12px}section,header{padding:15px}.product{grid-template-columns:1fr}.phone{height:150px;width:80px}}

body{background:linear-gradient(130deg,#e6efff,#edfaf3 65%,#fff3da);color:#182842}main{max-width:1060px;padding:24px}header,section{border-color:#ccdced;border-radius:19px;box-shadow:0 9px 24px #203d6114}h1,h2{letter-spacing:-.035em}h1{font-size:clamp(2rem,6vw,3.2rem);margin:.35em 0}h2{font-size:clamp(1.55rem,4vw,2.25rem);margin:.25em 0 .55em}
.hero{padding:clamp(24px,6vw,60px);color:white;background:linear-gradient(125deg,#182b51,#2556a2 68%,#146c74)}.hero small{color:#e6f2ff}.hero p{max-width:65ch}.hero .choices{margin:22px 0;gap:12px}.hero .choices button{background:#fff;color:#183866;border-color:white;padding:14px 18px}.hero .choices button+button{background:#d9f8ee}
button{border-color:#bfcee3;border-radius:10px;font-weight:650}button.primary,.product button:first-of-type{background:#174eaa;color:white;border-color:#174eaa}button:hover{background:#e5efff}button.primary:hover,.product button:first-of-type:hover{background:#123b82}button:focus-visible,a:focus-visible,.hit:focus-visible{outline:3px solid #995000;outline-offset:3px}
.toolbar{padding:10px;background:#eaf3fd;border:1px solid #cddff0;border-radius:13px;margin-bottom:12px}.toolbar [role=status]:not(:empty){padding:5px 9px;background:#d7f4e5;border-radius:7px;font-weight:700}
.address{display:flex;align-items:center;gap:9px;background:#edf4ff;padding:9px 11px;border-radius:9px;font-family:ui-monospace,monospace}.dots{display:inline-flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:#ed6a72}.dots i:nth-child(2){background:#e9ae32}.dots i:nth-child(3){background:#29a77f}header nav button{background:#edf4ff}
.product>.hit:first-child{min-height:280px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(ellipse at 70% 25%,#eee1ff,#dceaff 55%,#d9f6e9)}.phone{position:relative;width:120px;height:230px;transform:rotate(-8deg);background:radial-gradient(ellipse at 30% 70%,#65d7d7,#24648e 30%,transparent 64%),radial-gradient(ellipse at 85% 24%,#9d86e8,#26376c 53%,#17263b);box-shadow:9px 14px 24px #18335855}.phone:before{content:'';position:absolute;top:8px;left:calc(50% - 20px);width:40px;height:11px;border-radius:9px;background:#111929}.price{font-size:2em;color:#17644e}.promo,.seal{display:inline-block;border-radius:8px;background:#fff0c9;color:#704400;padding:4px 9px;font-weight:700}.seal{border:1px solid #e4c65f}.product button{margin-top:7px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}.card{padding:13px;background:#f1f6ff;border:1px solid #d4e1f2;border-radius:12px}.card p{margin:.4em 0}.stars{color:#805200;display:block;letter-spacing:.08em}.card time{color:#485d7b;font-size:.85em}.pay .card{background:#e7f7f1;border-color:#c4e5d9;font-weight:700}#timer{background:#fff0d6;color:#713900;border-radius:12px;padding:12px 15px}#clock{font-variant-numeric:tabular-nums}.marked{outline:3px solid #225dc3;background:#e4efff!important}
@media(max-width:550px){main{padding:12px}.toolbar{position:static}.product>.hit:first-child{min-height:195px}.phone{width:83px;height:155px}}

.price-row,.rating-row,.product-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.price-row del{color:#5d687b;font-size:1.12em}.discount{background:#bd233e;color:white;border-radius:7px;padding:2px 8px;font-size:.86rem;font-weight:800}.spec{display:inline-block;border-radius:20px;background:#e9f0fb;padding:3px 11px;font-size:.88rem}.spec-text{margin:7px 0 0;color:#435570}.rating-row,.product-actions{margin:7px 8px}.rating-stars{font-size:1.45rem;line-height:1;color:#a15d00;letter-spacing:.03em}.rating-stars.partial{background:linear-gradient(90deg,#a15d00 96%,#d6dfed 96%);background-clip:text;color:transparent}.rating-stars.full{color:#a15d00}.rating-row button,.product .shipping-button{background:#fff;color:#173b72;border-color:#a8bfdc;margin:0}.rating-row button:hover,.product .shipping-button:hover{background:#e8f1ff}.product-actions button{margin:0}.shipping-button span{margin-right:4px}.trust{display:inline-flex;align-items:center;gap:9px;text-decoration:none;padding:7px 13px;background:#fff4bf;border-color:#d4aa21}.trust i{display:grid;place-items:center;width:29px;height:29px;border:2px solid #29271b;border-radius:50%;background:#ffd538;color:#222;font:bold italic 24px/1 Georgia}.trust small{font-size:.75rem;color:#59441a}.delivery-error{border:1px solid #dfd5bf;border-radius:12px;background:#fff7e6;padding:14px}.delivery-error p,.delivery h3{margin:.25em 0}
</style><main id="app"></main>
<script>
const app=document.querySelector('#app');
const labels={product:'Produkt',reviews:'Bewertungen',contact:'Kontakt',legal:'Impressum',terms:'AGB',details:'Produktdetails',checkout:'Zur Bestellung'};
const clues=new Set(['price','pay','legal','contact','seal','reviews','url','terms','details']);
let shop='',page='product',marking=false,feedback='',timer;
const selected={spar:new Set(),apple:new Set()};
const state=()=>selected[shop];
const isFake=()=>shop==='spar';
const mark=(id,body)=>'<div class="hit '+(state().has(id)?'marked':'')+'" data-mark="'+id+'"'+(marking?' tabindex="0" role="button" aria-pressed="'+state().has(id)+'"':'')+'>'+body+'</div>';
const nav=(p)=>'<button data-page="'+p+'">'+labels[p]+'</button>';
const btn=(action,label,cls='')=>'<button class="'+cls+'" data-action="'+action+'">'+label+'</button>';
function tick(){
 const node=document.querySelector('#clock'); if(!node)return;
 const remaining=Math.max(0,Math.ceil((Number(sessionStorage.getItem('wr-fakeshop-deadline'))-Date.now())/1000));
 node.textContent=remaining?Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0'):'Angebot abgelaufen';
}
function body(){
 const fake=isFake();
 switch(page){
 case 'product': return '<div class="product">'+mark('image','<div class="phone" role="img" aria-label="Schwarzes iPhone"></div>')+'<div>'+mark('model','<h2>iPhone</h2><span class="spec">256 GB</span> <span class="spec">Schwarz</span><p class="spec-text">OLED-Display · Dual-Kamera · USB-C</p>')+mark('price',fake?'<div class="price-row"><span class="price">449 €</span> <del>1.449 €</del> <span class="discount">−69 %</span></div><span class="promo">Hier viel günstiger als bei Apple</span>':'<div class="price-row"><span class="price">1.449 €</span></div>')+'<div class="rating-row"><span class="rating-stars '+(fake?'full':'partial')+'" aria-hidden="true">★★★★★</span><strong aria-label="'+(fake?'5,0':'4,8')+' von 5 Sternen">'+(fake?'5,0':'4,8')+'</strong>'+nav('reviews')+'</div><div class="product-actions">'+nav('checkout')+'<button class="shipping-button" data-page="details"><span aria-hidden="true">▣</span> Versand &amp; Rückgabe</button></div></div></div>'+mark('seal',fake?'<span class="seal trust"><i aria-hidden="true">e</i><span>Trusted Shopp</span></span>':'<a class="seal trust" href="https://www.trustedshops.de/bewertung/info_XBA836F77173B1EFADBEDB0076F21B004.html" target="_blank" rel="noopener noreferrer"><i aria-hidden="true">e</i><span>Trusted Shops<small>Gültiges Siegel ansehen · afbshop.de</small></span><span aria-hidden="true">↗</span></a>');
 case 'checkout': return '<h2>Bestellung</h2>'+ (fake?mark('price','<div id="timer">Angebot nur noch 10 Minuten verfügbar<br><span id="clock">10:00</span></div>'):'')+mark('pay','<h3>Zahlungsarten</h3>'+('<div class="cards pay">'+(fake?['Nur Vorkasse per Überweisung']:['PayPal (mit Käuferschutz)','Kauf auf Rechnung','Kreditkarte','SEPA-Lastschrift']).map(m=>'<div class="card">'+m+'</div>').join('')+'</div>'))+'<p>iPhone · 256 GB · Schwarz</p>';
 case 'reviews': return '<h2>Das sagen unsere Kunden</h2>'+mark('reviews','<div class="cards">'+(fake?[['★★★★★','10.11.2026','Super Preis!'],['★★★★★','10.11.2026','Alles perfekt!'],['★★★★★','09.11.2026','Bester Shop!']]:[['★★★★☆','30.10.2026','Schnell geliefert, Verpackung etwas groß.'],['★★★☆☆','14.07.2026','Lieferung kam später als angekündigt.'],['★★★★★','12.02.2026','Bestellung und Lieferung problemlos.']]).map(([stars,date,review])=>'<article class="card"><strong class="stars">'+stars+'</strong><time>'+date+'</time><p>'+review+'</p></article>').join('')+'</div>');
 case 'contact':return '<h2>Kontakt</h2>'+mark('contact',fake?'Kontaktformular · Nachricht schreiben':'Apple Store · 0800 2000 136 · <a href="https://www.apple.com/de/contact/" target="_blank" rel="noopener noreferrer">Weitere Kontaktmöglichkeiten</a>');
 case 'legal':return '<h2>Impressum</h2>'+mark('legal',fake?'Sparhandy<br>Postfach 1234':'Apple Distribution International Ltd.<br>Hollyhill Industrial Estate, Hollyhill, Cork, Irland<br>Irisches Firmenregister: 470672');
 case 'terms':return '<h2>AGB</h2>'+mark('terms',fake?'Diese Bedingungen gelten für Bestellungen bei TrendKauf24. Der Gesamtpreis wird vor dem Kauf angezeigt.':'Diese Bedingungen gelten für Bestellungen bei Apple Distribution International Ltd. <a href="https://www.apple.com/de/shop/help/your_account" target="_blank" rel="noopener noreferrer">Apple Einkaufshilfe</a>');
 case 'details':return '<h2>Versand &amp; Rückgabe</h2>'+mark('details',fake?'<div class="delivery-error"><strong>Technische Schwierigkeiten</strong><p>Diese Seite ist momentan nicht verfügbar. Bitte versuche es später erneut.</p></div>':'<div class="cards delivery"><article class="card"><h3>Kostenloser Versand</h3><p>Versand mit DHL.</p></article><article class="card"><h3>14 Tage Rückgabe</h3><p>Rückgabe ohne Angabe von Gründen.</p></article><article class="card"><h3>Technischer Defekt?</h3><p>Wende dich an den Kundenservice. Er prüft den Fehler und erklärt die nächsten Schritte.</p></article></div><small>Versand- und Rückgabebedingungen der Unterrichtssimulation.</small>');
 }
}
function render(){
 clearInterval(timer);
 if(!shop){app.className='';app.innerHTML='<header class="hero"><small>Wirtschaft und Recht · Unterrichtssimulation</small><h1>Fake-Shop identifizieren</h1><p>Öffnet zu zweit je einen Shop. Untersucht eure Seiten und vergleicht eure Funde.</p><div class="choices">'+btn('spar','Online-Shop Sparhandy','primary')+btn('apple','Online-Shop Apple','primary')+'</div><p><small>Die dargestellten Shops sind Simulationen. Es sind keine Käufe oder Zahlungen möglich. Die Übung ist unabhängig von Apple, Trusted Shops und dem gleichnamigen Anbieter Sparhandy.</small></p></header>';return}
 app.className=marking?'marking':'';
 app.innerHTML='<div class="toolbar">'+btn('home','← Shop-Auswahl')+btn('mark',marking?'Suchmodus beenden':'Suchmodus starten','primary')+(isFake()?btn('check','Auswahl prüfen'):'')+'<span role="status">'+feedback+'</span></div><header>'+mark('url','<small class="address"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>'+(isFake()?'http://aple-angebote.shop':'https://www.apple.com/de/')+'</small>')+'<h1>'+(isFake()?'Sparhandy':'Apple')+'</h1><nav>'+['product','reviews','contact'].map(nav).join('')+'</nav></header><section>'+body()+'</section><section><nav>'+['legal','terms','contact'].map(nav).join('')+'</nav></section><small>Unterrichtssimulation · '+(isFake()?'Sparhandy':'Apple-Vergleichsseite')+'</small>';
 tick();if(document.querySelector('#clock'))timer=setInterval(tick,1000);
}
app.addEventListener('click',e=>{
 const hit=e.target.closest('[data-mark]');
 if(marking&&hit){e.preventDefault();const id=hit.dataset.mark;state().has(id)?state().delete(id):state().add(id);feedback='';render();app.querySelector('[data-mark="'+id+'"]').focus();return}
 const button=e.target.closest('button');if(!button)return;
 const action=button.dataset.action;
 if(button.dataset.page){page=button.dataset.page;feedback='';if(isFake()&&page==='checkout'&&!sessionStorage.getItem('wr-fakeshop-deadline'))sessionStorage.setItem('wr-fakeshop-deadline',Date.now()+600000)}
 if(action==='home'){shop='';marking=false;feedback=''}
 if(action==='spar'||action==='apple'){shop=action;page='product';marking=false;feedback=''}
 if(action==='mark')marking=!marking;
 if(action==='check'){const count=[...state()].filter(id=>clues.has(id)).length;feedback=count+' von 9 gefunden · '+(9-count)+' fehlen · '+(state().size-count)+' falsch markiert'}
 render();
});
app.addEventListener('keydown',e=>{if(marking&&e.target.matches('[data-mark]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click()}});
render();
</script>
