const targets={

 pay:['Nur Vorkasse per Überweisung','PayPal (mit Käuferschutz)','Kauf auf Rechnung','Kreditkarte','SEPA-Lastschrift'],

 url:['http://aple-angebote.shop','https://www.apple.com/de/'],
 terms:['TrendKauf24','Apple Distribution International Ltd.'],
 details:['Technische Schwierigkeiten','Versand mit DHL.','14 Tage Rückgabe']
};
const groups={spar:new Map(),apple:new Map()};
function decorate(){

 for(const area of app.querySelectorAll('[data-area]')){
  const id=area.dataset.area;
  const walker=document.createTreeWalker(area,4);
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  let index=0;
  for(const node of nodes){
   if(!node.data.trim()||node.parentElement.closest('[aria-hidden="true"]')||node.parentElement.id==='clock')continue;
   const fragment=document.createDocumentFragment();
   const phrases=[...(targets[id]||[])].sort((a,b)=>b.length-a.length);
   let remaining=node.data;
   while(remaining){
    const phrase=phrases.find(p=>remaining.startsWith(p));
    const part=phrase||remaining.match(/^\s+|^[\p{L}\p{N}]+(?:[-’][\p{L}\p{N}]+)*|^./su)[0];
    remaining=remaining.slice(part.length);
    if(!phrase&&!/[\p{L}\p{N}]/u.test(part)){fragment.append(part);continue}
    const key=page+':'+id+':'+index++;
    const span=document.createElement('span');
    span.className='token'+(state().has(key)?' marked':'');
    span.dataset.mark=key;
    span.textContent=part;
    if(phrase)groups[shop].set(key,id);
    if(marking){span.tabIndex=0;span.setAttribute('role','button');span.setAttribute('aria-pressed',state().has(key))}
    fragment.append(span);
   }
   node.replaceWith(fragment);
  }
 }
}

 const node=document.querySelector('#clock'); if(!node)return;
 const remaining=Math.max(0,Math.ceil((Number(sessionStorage.getItem('wr-fakeshop-deadline'))-Date.now())/1000));
 node.textContent=remaining?Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0'):'Angebot abgelaufen';
}

 case 'checkout': return '<h2>Bestellung</h2>'+ (fake?mark('price','<div id="timer">Angebot nur noch 10 Minuten verfügbar<br><span id="clock">10:00</span></div>'):'')+mark('pay','<h3>Zahlungsarten</h3>'+('<div class="cards pay">'+(fake?['Nur Vorkasse per Überweisung']:['PayPal (mit Käuferschutz)','Kauf auf Rechnung','Kreditkarte','SEPA-Lastschrift']).map(m=>'<div class="card">'+m+'</div>').join('')+'</div>'))+'<p>iPhone · 256 GB · Schwarz</p>';
 case 'reviews': return '<h2>Das sagen unsere Kunden</h2>'+mark('reviews','<div class="cards">'+(fake?[['★★★★★','10.11.2026','Super Preis!'],['★★★★★','10.11.2026','Alles perfekt!'],['★★★★★','09.11.2026','Bester Shop!']]:[['★★★★☆','30.10.2026','Schnell geliefert, Verpackung etwas groß.'],['★★★☆☆','14.07.2026','Lieferung kam später als angekündigt.'],['★★★★★','12.02.2026','Bestellung und Lieferung problemlos.']]).map(([stars,date,review])=>'<article class="card"><strong class="stars">'+stars+'</strong><time>'+date+'</time><p>'+review+'</p></article>').join('')+'</div>');
 case 'contact':return '<h2>Kontakt</h2>'+mark('contact',fake?'<div class="card"><h3>E-Mail</h3><p>guenstig-sparhandy1825@o2.pl</p></div>':'<div class="cards"><div class="card"><h3>Hotline</h3><p>0800 2000 136</p></div><div class="card"><h3>E-Mail</h3><p>info@apple.de</p></div><div class="card"><h3>Vor Ort</h3><p><a href="https://www.apple.com/de/retail/" target="_blank" rel="noopener noreferrer">Apple Store in deiner Nähe finden</a></p></div></div>');
 case 'legal':return '<h2>Impressum</h2>'+mark('legal','<div class="cards"><div class="card"><h3>Anbieter</h3>'+(fake?'<p><strong>Sparhandy Ltd.</strong><br>Postfach 1234<br>London, Vereinigtes Königreich</p>':'<p><strong>Apple Distribution International Ltd.</strong><br>Hollyhill Industrial Estate<br>Hollyhill, Cork<br>Irland</p><p>contactus.de@euro.apple.com</p></div><div class="card"><h3>Register und Umsatzsteuer</h3><p>Irisches Handelsregister<br>Registrierungsnummer: 470672</p><p>USt-IdNr.: IE9700053D</p>')+'</div></div>');

 }
}

 ['Impressum','8','F','Fehlende, falsche oder unvollständige Angaben oder nur ein Postfach','Name, Rechtsform, Anschrift, Kontakt und USt-ID','Falsche Anschrift: Auf Google Maps nur ein unbebautes Grundstück'],
 ['Kontaktdaten','7','B','Kontaktdaten fehlen','Telefonnummer und E-Mail-Adresse passen zum Firmennamen (info@shopname.de)','E-Mail-Adresse passt nicht zum Shop-Namen · Telefonnummer nicht vergeben'],
 ['Gütesiegel','4','I','Siegel ohne Nachweis (z. B. Klicktest)','Siegel verlinkt auf ein gültiges Zertifikat für genau diesen Shop, z. B. Trusted Shops','Erfundenes oder kopiertes Siegel · nur ein Bild, kein Zertifikat per Klick'],
 ['Bewertungen','1','E','Nur Bestbewertungen, keine älteren Bewertungen','Unterschiedliche Bewertungen über längere Zeit, auch auf unabhängigen Portalen','Nur neue Fünf-Sterne-Bewertungen · keine älteren Bewertungen'],
 ['Shop-URL','9','H','Unverschlüsselte Verbindung, Tippfehler oder auffällige Domain','Verschlüsselte Verbindung, z. B. https://firmenname.de','http:// · Tippfehler wie anazon.de · unerwartete Endung wie .de.com oder .shop'],
 ['AGB','2','A','Fehlerhafte AGB, z. B. mit fremdem Firmennamen','Leicht auffindbar, mit dem korrekten Firmennamen','Impressum: Sparhandy Ltd. · AGB: TrendKauf24'],
 ['Erscheinungsbild der Website','5','C','Rechtschreibfehler oder leere Unterseiten','Stimmige Website','Unterseiten öffnen sich nicht · auffällige Rechtschreibfehler']
];
const cardOrder=['4','D','A','H','7','6','1','G','F','B','9','5','I','3','C','8','E','2'];
const cards=new Map(puzzle.flatMap((row,i)=>[[row[1],{i,side:0,text:row[3]}],[row[2],{i,side:1,text:row[4]}]]));
const solved=new Map();
const selectedPair=[null,null];
let tableOpen=false,tableUnlocked=false,puzzleStatus='',joined=null,activeRow=null;
function paper(key,other,interactive){
 const {side,text}=cards.get(key);
 const content='<span class="paper-id">'+key+'</span><span class="paper-other" aria-label="Gegenstück '+(other||'leer')+'">'+(other||'&nbsp;')+'</span><span>'+text+'</span>';
 const cls='paper '+(side?'paper-serious':'paper-fake');
 return interactive?'<button type="button" class="'+cls+'" data-paper="'+key+'" aria-pressed="'+(selectedPair[side]===key)+'">'+content+'</button>':'<div class="'+cls+'">'+content+'</div>';
}
function renderTable(){
 app.className='table-view';
 if(!tableUnlocked){
  app.innerHTML='<section><button data-table="back">← Startseite</button><h1>Tabelle öffnen</h1><form id="table-pass"><label for="table-password">Passwort</label> <input id="table-password" type="password" required> <button class="primary">Öffnen</button><p id="pass-status" role="status"></p></form></section>';
  return;
 }
 const completed=[...solved.values()].filter(row=>row.named).length;
 const rows=puzzle.map((row,i)=>{
  const item=solved.get(i);
  const name=item?.named?'<strong>'+row[0]+'</strong>':item?'<button data-row="'+i+'" aria-pressed="'+(activeRow===i)+'">Merkmal wählen</button>':'<span class="pending">–</span>';
  return '<tr><th scope="row">'+(i+1)+'</th><td>'+name+'</td><td>'+ (item?row[1]:'–')+'</td><td>'+(item?.named?'<button data-example="'+i+'" aria-expanded="'+item.example+'">'+(item.example?'Beispiel ausblenden':'Beispiel anzeigen')+'</button>'+(item.example?'<p class="puzzle-example">'+row[5]+'</p>':''):'–')+'</td><td>'+(item?row[2]:'–')+'</td></tr>';
 }).join('');
 const wordBank=puzzle.map((row,i)=>({row,i})).sort((a,b)=>a.row[0].localeCompare(b.row[0],'de')).map(({row,i})=>'<button data-word="'+i+'"'+(activeRow===null||solved.get(i)?.named?' disabled':'')+'>'+row[0]+'</button>').join('');
 const bank=cardOrder.filter(key=>!solved.has(cards.get(key).i)).map(key=>{
  const side=cards.get(key).side;
  return paper(key,selectedPair[side]===key?selectedPair[1-side]:null,true);
 }).join('');
 const joinedView=joined===null?'':'<div class="joined-panel"><h3>Das Paar passt!</h3><div class="joined-paper">'+paper(puzzle[joined][1],puzzle[joined][2],false)+paper(puzzle[joined][2],puzzle[joined][1],false)+'</div><button data-table="wordbank">Zur Wörterbank</button></div>';
 app.innerHTML='<section class="puzzle-shell"><div class="puzzle-heading"><button data-table="back">← Startseite</button><strong>'+completed+' / 9 Merkmale zugeordnet</strong></div><h1>Warnsignale im Überblick</h1><p>Bonnies Hund hat die Übersicht zerrissen. Ordnet die Schnipsel paarweise zu und findet das gemeinsame Merkmal.</p><div class="table-scroll"><table class="puzzle-table"><thead><tr><th scope="col">Nr.</th><th scope="col">Merkmal</th><th scope="colgroup" colspan="2">Fake-Shop · Nummer und Beispiel</th><th scope="col">Seriöser Online-Shop</th></tr></thead><tbody>'+rows+'</tbody></table></div><div id="puzzle-words" tabindex="-1"><h2>Wörterbank</h2><p>'+(activeRow===null?'Findet zuerst ein Schnipselpaar.':'Wählt das Merkmal für Zeile '+(activeRow+1)+'.')+'</p><div class="puzzle-words">'+wordBank+'</div></div><div class="puzzle-controls"><button class="primary" data-table="check"'+(selectedPair.includes(null)?' disabled':'')+'>Paar prüfen</button><button data-table="undo"'+(solved.size?'':' disabled')+'>Letztes Paar zurücklegen</button><button data-table="clear">Tabelle leeren</button><span role="status">'+puzzleStatus+'</span></div>'+joinedView+'<h2>Schnipsel</h2><p>Zahlen: Fake-Shop · Buchstaben: seriöser Online-Shop</p><div class="paper-bank">'+bank+'</div></section>';
}
function handlePuzzle(button){
 const {table,paper:key,row,word,example}=button.dataset;
 if(table==='back'){tableOpen=false;render();return}
 if(table==='clear'){solved.clear();selectedPair.fill(null);joined=null;activeRow=null;puzzleStatus=''}
 if(table==='undo'){
  const last=[...solved.keys()].pop();
  solved.delete(last);if(activeRow===last)activeRow=null;if(joined===last)joined=null;
  selectedPair.fill(null);puzzleStatus='Paar zurückgelegt.';
 }
 if(key!==undefined){
  const {side}=cards.get(key);
  selectedPair[side]=selectedPair[side]===key?null:key;
  joined=null;puzzleStatus='';
 }
 if(table==='check'&&!selectedPair.includes(null)){
  const left=cards.get(selectedPair[0]).i,right=cards.get(selectedPair[1]).i;
  selectedPair.fill(null);
  if(left===right){
   solved.set(left,{named:false,example:false});activeRow=left;joined=left;
   puzzleStatus='Richtig! Wählt jetzt das passende Merkmal.';
  }else{joined=null;puzzleStatus='Versuche es noch einmal!'}
 }
 if(row!==undefined){activeRow=Number(row);puzzleStatus=''}
 if(word!==undefined&&activeRow!==null){
  if(Number(word)===activeRow){
   solved.get(activeRow).named=true;activeRow=null;puzzleStatus='Merkmal richtig zugeordnet.';
  }else puzzleStatus='Das Merkmal passt noch nicht. Versuche es noch einmal!';
 }
 if(example!==undefined){const item=solved.get(Number(example));if(item?.named)item.example=!item.example}
 renderTable();
 if(table==='wordbank'||row!==undefined)app.querySelector('#puzzle-words').focus();
 else if(table==='check'){
  const panel=app.querySelector('.joined-panel');
  if(panel)panel.scrollIntoView({block:'nearest',behavior:'smooth'});
 }else if(key!==undefined)app.querySelector('[data-paper="'+key+'"]')?.focus({preventScroll:true});
 else if(example!==undefined)app.querySelector('[data-example="'+example+'"]')?.focus({preventScroll:true});
}
app.addEventListener('submit',e=>{
 if(e.target.id!=='table-pass')return;
 e.preventDefault();
 if(app.querySelector('#table-password').value.trim().toLowerCase()==='merkmale'){tableUnlocked=true;renderTable()}
 else app.querySelector('#pass-status').textContent='Das Passwort stimmt nicht.';
});
function render(){
 clearInterval(timer);
 if(tableOpen){renderTable();return}
 if(!shop){app.className='';app.innerHTML='<header class="hero"><small>Wirtschaft und Recht · Unterrichtssimulation</small><h1>Fake-Shop oder seriöser Online-Shop?</h1><p><strong>Finde heraus, woran du den Unterschied erkennst.</strong></p><p>Öffnet zu zweit je einen Shop. Untersucht eure Seiten und vergleicht eure Funde.</p><div class="choices">'+btn('spar','Online-Shop Sparhandy','primary')+btn('apple','Online-Shop Apple','primary')+'</div><p><small>Die dargestellten Shops sind Simulationen. Es sind keine Käufe oder Zahlungen möglich. Die Übung ist unabhängig von Apple, Trusted Shops und dem gleichnamigen Anbieter Sparhandy.</small></p></header><footer class="table-entry">'+btn('table','Tabelle')+'</footer>';return}
 if(page==='certificate'){
 app.className='';
 app.innerHTML='<div class="directory"><div class="directory-browser"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><code>https://trustedshops.example/shopverzeichnis/apple</code></div><div class="directory-banner"><span class="trust"><i aria-hidden="true">e</i><strong>TRUSTED SHOPS</strong></span><div class="directory-search"><span aria-hidden="true">⌕</span> apple</div></div><p class="directory-label">Unterrichtssimulation · Nachgebildetes Shop-Verzeichnis</p><div class="directory-grid"><aside><h2>Kategorien</h2><ul><li>Elektronik</li><li>Computer &amp; Zubehör</li><li>Smartphones</li></ul></aside><div><h2>1 Ergebnis für „apple“</h2><article><h3>apple.com/de</h3><p><strong>4,8 / 5</strong> <span class="rating-stars partial" aria-hidden="true">★★★★★</span></p><p><strong>Gütesiegel</strong> <span class="directory-valid">Gültig in der Übung</span></p><p>Apple Distribution International Ltd.<br>Shop-Adresse: <strong>www.apple.com/de/</strong></p><small>Musterzertifikat für den Unterricht</small></article></div></div><button data-page="product">← Zurück zum Apple-Shop</button></div>';
 return;
 }
 app.className=marking?'marking':'';
 app.innerHTML='<div class="toolbar">'+btn('home','← Shop-Auswahl')+btn('mark',marking?'Suchmodus beenden':'Suchmodus starten','primary')+btn('check','Auswahl prüfen')+'<span role="status">'+feedback+'</span></div><header>'+mark('url','<small class="address"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>'+(isFake()?'http://aple-angebote.shop':'https://www.apple.com/de/')+'</small>')+'<h1>'+(isFake()?'Sparhandy':'Apple')+'</h1><nav>'+['product','reviews','contact'].map(nav).join('')+'</nav></header><section>'+body()+'</section><section><nav>'+['legal','terms','contact'].map(nav).join('')+'</nav></section><small>Unterrichtssimulation · '+(isFake()?'Sparhandy':'Apple-Vergleichsseite')+'</small>';
 if(unlocked){
 const index=[...clues].indexOf(hint);
 app.insertAdjacentHTML('beforeend','<section class="solution-note" id="solution-note" tabindex="-1"><h2>'+(index<0?'Lösungshinweise freigeschaltet':'Lösungshinweis · '+hintTitles[index])+'</h2><p>'+(index<0?'Wähle eine richtig markierte Stelle aus, um die Erklärung zu lesen.':hintTexts[shop][index])+'</p></section>');
 }
 decorate();tick();if(document.querySelector('#clock'))timer=setInterval(tick,1000);
}
app.addEventListener('click',e=>{
 const hit=e.target.closest('[data-mark]');
 if(marking&&hit){e.stopPropagation();e.preventDefault();const id=hit.dataset.mark;if(unlocked){const group=groups[shop].get(id);if(state().has(id)&&group){hint=group;render();document.querySelector('#solution-note').focus()}return}state().has(id)?state().delete(id):state().add(id);feedback='';render();app.querySelector('[data-mark="'+id+'"]').focus();return}
 const button=e.target.closest('button');if(!button)return;
 const action=button.dataset.action;
 if(action==='table'){tableOpen=true;render();return}
 if(tableOpen){if(!button.closest('#table-pass'))handlePuzzle(button);return}
 if(button.dataset.page){page=button.dataset.page;feedback='';if(isFake()&&page==='checkout'&&!sessionStorage.getItem('wr-fakeshop-deadline'))sessionStorage.setItem('wr-fakeshop-deadline',Date.now()+600000)}
 if(action==='home'){resetSearch();shop=''}
 if(action==='spar'||action==='apple'){shop=action;page='product';marking=false;feedback=''}
 if(action==='mark'){if(marking)resetSearch();else marking=true;}
 if(action==='check'){const selectedGroups=[...state()].map(key=>groups[shop].get(key));const count=new Set(selectedGroups.filter(Boolean)).size;if(marking&&count===clues.size)unlocked=true;feedback=(isFake()?'Fake-Shop-Merkmale identifizieren':'Merkmale eines seriösen Online-Shops identifizieren')+' · '+count+' von 9 gefunden · '+(9-count)+' fehlen · '+selectedGroups.filter(group=>!group).length+' falsch markiert'}
 render();
});
app.addEventListener('keydown',e=>{if(marking&&e.target.matches('[data-mark]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click()}});
render();
</script>
